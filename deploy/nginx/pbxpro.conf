map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name pbxpro.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pbxpro.test;
    root /var/www/pbxpro/frontend;
    index index.html;

    ssl_certificate /etc/nginx/ssl/pbxpro.test.pem;
    ssl_certificate_key /etc/nginx/ssl/pbxpro.test-key.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }
    location ^~ /api/ { try_files $uri @laravel; }
    location ^~ /sanctum/ { try_files $uri @laravel; }
    location ^~ /broadcasting/ { try_files $uri @laravel; }
    location = /up { try_files $uri @laravel; }
    location ^~ /freeswitch/ { allow 127.0.0.1; deny all; try_files $uri @laravel; }
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/pbxpro/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/pbxpro/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ /\. { deny all; }
}
